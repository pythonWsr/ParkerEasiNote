# build：统一编排 test 分支的 5 个打包 workflow（§8.6 / §11.3）
#
# 设计：不复刻打包脚本，用 App token 触发 test 上已验证的 build-*.yml，
# 下载 artifact 后统一上传（artifact + 可选 draft Release）。
#
# 发版由 pr.py release 驱动：先在 main 上创建 draft Release，再触发本 workflow，
# 成功后把 draft 转正；IPA 按 §27 只进 artifact，由协作者签名后手动上传。
name: build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "打包平台"
        required: true
        default: all
        type: choice
        options: [all, html, exe, apk, ipa, dmg]
      tag:
        description: "可选：已存在的 Release tag（如 v10.1.7）；留空只上传 artifact"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ inputs.tag || 'adhoc' }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          persist-credentials: false
      - id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('web/version.json',encoding='utf-8'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "构建版本：$V"

  package:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: html, workflow: build-html.yml }
          - { key: exe, workflow: build-verify-exe.yml }
          - { key: apk, workflow: build-apk.yml }
          - { key: ipa, workflow: build-ipa.yml }
          - { key: dmg, workflow: build-dmg.yml }
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - name: 触发 test 分支打包
        id: trigger
        if: ${{ inputs.platform == 'all' || inputs.platform == matrix.key }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run "${{ matrix.workflow }}" --ref test -R "$GITHUB_REPOSITORY"
          sleep 8
          RID=$(gh run list --workflow "${{ matrix.workflow }}" --branch test \
                  -R "$GITHUB_REPOSITORY" --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "rid=$RID" >> "$GITHUB_OUTPUT"
          gh run watch "$RID" -R "$GITHUB_REPOSITORY" --exit-status

      - name: 下载 artifact
        if: ${{ inputs.platform == 'all' || inputs.platform == matrix.key }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          NAME="ParkerEasiNote-${VERSION}-${{ matrix.key }}"
          gh run download "${{ steps.trigger.outputs.rid }}" -R "$GITHUB_REPOSITORY" --name "$NAME" --dir dist \
            || gh run download "${{ steps.trigger.outputs.rid }}" -R "$GITHUB_REPOSITORY" --dir dist
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.platform == 'all' || inputs.platform == matrix.key }}
        with:
          name: ParkerEasiNote-${{ needs.version.outputs.version }}-${{ matrix.key }}
          path: dist/*
          if-no-files-found: error

      # Release 只放 apk/exe/ipa/dmg；html 单文件只进 artifact
      - name: 上传到 Release
        if: ${{ inputs.tag != '' && matrix.key != 'html' && (inputs.platform == 'all' || inputs.platform == matrix.key) }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.tag }}" dist/* -R "$GITHUB_REPOSITORY" --clobber

      - name: HTML 说明
        if: ${{ matrix.key == 'html' && (inputs.platform == 'all' || inputs.platform == 'html') }}
        run: echo "::notice::HTML 单文件只上传 artifact，不进 Release"
