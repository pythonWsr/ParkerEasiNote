name: build-dmg

# 仅在 test 分支构建；未签名 dmg（AppKit + WKWebView 壳），产物只上传 artifact
on:
  push:
    branches: [test]
    paths:
      - 'desktop-build/macos/**'
      - 'web/**'
      - 'tools/bundle_html.py'
      - '.github/workflows/build-dmg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS DMG (unsigned, WKWebView shell)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle single-file HTML
        run: python3 tools/bundle_html.py --out 快捷白板10.html

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          clang --version | head -1

      - name: Build unsigned DMG
        run: bash desktop-build/macos/build.sh

      - name: Verify DMG
        run: |
          set -e
          DMG=desktop-build/macos/build/EasiNote.dmg
          SIZE=$(stat -f%z "$DMG")
          echo "DMG: $DMG  ${SIZE} B ($((SIZE/1024/1024)) MB)"
          echo "::notice title=DMG 体积::${SIZE} B ($((SIZE/1024)) KB)"

          hdiutil verify "$DMG"

          MNT="$RUNNER_TEMP/en10mnt"
          mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG"
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT

          ls -la "$MNT"
          APP="$MNT/快捷白板10.app"
          [ -d "$APP" ] || APP="$MNT/EasiNote.app"
          [ -d "$APP" ] || { echo "dmg 里找不到 .app"; exit 1; }

          test -f "$APP/Contents/Resources/index.html"
          grep -q 'ParkerEasiNote10' "$APP/Contents/Resources/index.html" && echo "OK: 页面内容已打入 Resources"
          grep -q 'EN10_HANZI' "$APP/Contents/Resources/index.html" && echo "OK: 离线资源已内联"
          file "$APP/Contents/MacOS/EasiNote"
          lipo -info "$APP/Contents/MacOS/EasiNote" || true
          plutil -lint "$APP/Contents/Info.plist"

          echo "OK: DMG 结构正常（未签名）"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: easinote-dmg
          path: desktop-build/macos/build/EasiNote.dmg
          if-no-files-found: error
          retention-days: 7
