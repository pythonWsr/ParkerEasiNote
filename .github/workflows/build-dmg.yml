name: build-dmg

# 仅在 test 分支构建；直接打包 web/ 多文件目录；未签名 dmg（AppKit + WKWebView 壳）
on:
  push:
    branches: [test]
    paths:
      - 'desktop-build/macos/**'
      - 'web/**'
      - '.github/workflows/build-dmg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS DMG (unsigned, WKWebView shell)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('web/version.json',encoding='utf-8'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "web version: $V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          clang --version | head -1

      - name: Build unsigned DMG
        run: bash desktop-build/macos/build.sh

      - name: Package artifact
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          cp desktop-build/macos/build/EasiNote.dmg "dist/ParkerEasiNote-${VERSION}.dmg"

      - name: Verify DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          DMG="dist/ParkerEasiNote-${VERSION}.dmg"
          SIZE=$(stat -f%z "$DMG")
          echo "DMG: $DMG  ${SIZE} B ($((SIZE/1024/1024)) MB)"
          echo "::notice title=DMG 体积::${SIZE} B ($((SIZE/1024)) KB)"

          hdiutil verify "$DMG"

          MNT="$RUNNER_TEMP/en10mnt"
          mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG"
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT

          ls -la "$MNT"
          APP="$MNT/EasiNote.app"
          [ -d "$APP" ] || { echo "dmg 里找不到 EasiNote.app"; exit 1; }

          test -f "$APP/Contents/Resources/www/index.html"
          test -f "$APP/Contents/Resources/www/js/app.js"
          grep -q 'ParkerEasiNote10' "$APP/Contents/Resources/www/index.html" && echo "OK: 多文件页面已打入 Resources/www"
          grep -q 'css/tokens.css' "$APP/Contents/Resources/www/index.html" && echo "OK: 子资源引用保留（未内联）"
          file "$APP/Contents/MacOS/EasiNote"
          lipo -info "$APP/Contents/MacOS/EasiNote" || true
          plutil -lint "$APP/Contents/Info.plist"

          echo "OK: DMG 结构正常（未签名，多文件形式）"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ParkerEasiNote-${{ steps.ver.outputs.version }}-dmg
          path: dist/ParkerEasiNote-${{ steps.ver.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 7
