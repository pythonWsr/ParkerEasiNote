name: build-apk

# 仅在 test 分支构建；直接打包 web/ 多文件目录（不再先生成单文件 HTML）
on:
  push:
    branches: [test]
    paths:
      - 'mobile-build/android/**'
      - 'web/**'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK (WebView shell)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('web/version.json',encoding='utf-8'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "web version: $V"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "SDK=$SDK"
          ls "$SDK/build-tools" 2>/dev/null || true
          if [ ! -d "$SDK/build-tools/34.0.0" ] || [ ! -d "$SDK/platforms/android-34" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SM" ] || SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
            echo "using sdkmanager: $SM"
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "build-tools;34.0.0" "platforms;android-34"
          fi

      - name: Build APK
        run: bash mobile-build/android/build.sh

      - name: Package artifact
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          cp mobile-build/android/out/EasiNote.apk "dist/ParkerEasiNote-${VERSION}.apk"

      - name: Verify APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          APK="dist/ParkerEasiNote-${VERSION}.apk"
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK  ${SIZE} B ($((SIZE/1024)) KB)"
          echo "::notice title=APK 体积::${SIZE} B ($((SIZE/1024)) KB)"

          BT=$(ls -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"/build-tools/* | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | head -3
          echo "$BADGING" | grep -q "package: name='com.ParkerEasiNote'" || {
            echo "包名不是 com.ParkerEasiNote"; exit 1;
          }

          unzip -l "$APK" | grep -E 'classes\.dex|assets/www/index\.html|assets/www/js/app\.js|assets/www/vendor/|resources\.arsc'
          unzip -p "$APK" assets/www/index.html | head -c 64
          echo
          unzip -p "$APK" assets/www/index.html | grep -q 'ParkerEasiNote10' && echo "OK: 多文件页面已打入 assets/www"
          unzip -p "$APK" assets/www/index.html | grep -q 'css/tokens.css' && echo "OK: 子资源引用保留（未内联）"

          # 权限：相机 / 麦克风 / 写入存储 / 网络
          for P in CAMERA RECORD_AUDIO WRITE_EXTERNAL_STORAGE INTERNET; do
            echo "$BADGING" | grep -q "uses-permission: name='android.permission.$P'" \
              || { echo "缺少权限: $P"; exit 1; }
          done
          echo "OK: 权限齐全"

          # Android 11+ 安装硬要求：resources.arsc 必须未压缩且 4 字节对齐
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null \
            || { echo "zipalign 校验失败（Android 11+ 可能无法安装）"; exit 1; }
          echo "OK: zipalign 4 字节对齐"

          # 签名方案：Android 11+ 对 targetSdk>=30 强制 v2，缺了会"部分设备装不上"
          "$BT/apksigner" verify --verbose "$APK" | grep -q "Verified using v2 scheme" \
            || { echo "缺少 v2 签名"; exit 1; }
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          echo "OK: 签名含 v2"
          echo "OK: APK 结构正常（包名 com.ParkerEasiNote，多文件形式）"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkerEasiNote-${{ steps.ver.outputs.version }}-apk
          path: dist/ParkerEasiNote-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7
