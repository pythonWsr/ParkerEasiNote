name: build-apk

# 仅在 test 分支构建；页面与移动端配置都不进入 main
on:
  push:
    branches: [test]
    paths:
      - 'mobile-build/android/**'
      - 'web/**'
      - 'tools/bundle_html.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK (WebView shell)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle single-file HTML
        run: python3 tools/bundle_html.py --out 快捷白板10.html

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "SDK=$SDK"
          ls "$SDK/build-tools" 2>/dev/null || true
          if [ ! -d "$SDK/build-tools/34.0.0" ] || [ ! -d "$SDK/platforms/android-34" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SM" ] || SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
            echo "using sdkmanager: $SM"
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "build-tools;34.0.0" "platforms;android-34"
          fi

      - name: Build APK
        run: bash mobile-build/android/build.sh

      - name: Verify APK
        run: |
          set -e
          APK=mobile-build/android/out/EasiNote.apk
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK  ${SIZE} B ($((SIZE/1024)) KB)"
          echo "::notice title=APK 体积::${SIZE} B ($((SIZE/1024)) KB)"

          BT=$(ls -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"/build-tools/* | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | head -3
          echo "$BADGING" | grep -q "package: name='com.ParkerEasiNote'" || {
            echo "包名不是 com.ParkerEasiNote"; exit 1;
          }

          unzip -l "$APK" | grep -E 'classes\.dex|assets/index\.html|resources\.arsc'
          unzip -p "$APK" assets/index.html | head -c 64
          echo
          unzip -p "$APK" assets/index.html | grep -q 'ParkerEasiNote10' && echo "OK: 页面内容已打入 assets"
          unzip -p "$APK" assets/index.html | grep -q 'EN10_HANZI' && echo "OK: 离线资源已内联"
          echo "OK: APK 结构正常（包名 com.ParkerEasiNote）"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: easinote-apk
          path: mobile-build/android/out/EasiNote.apk
          if-no-files-found: error
          retention-days: 7
