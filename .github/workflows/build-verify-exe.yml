name: build-verify-exe

# 仅在 test 分支上构建；html 与构建配置都不进入 main
on:
  push:
    branches: [test]
    paths:
      - 'verify-build/**'
      - '.github/workflows/build-verify-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WV2_VERSION: '1.0.2903.40'

jobs:
  build:
    name: Windows exe (WebView2)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: verify-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$env:WV2_VERSION/microsoft.web.webview2.$env:WV2_VERSION.nupkg"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wv2.nupkg"
          Copy-Item "$env:RUNNER_TEMP\wv2.nupkg" "$env:RUNNER_TEMP\wv2.zip"
          Expand-Archive "$env:RUNNER_TEMP\wv2.zip" -DestinationPath "$env:RUNNER_TEMP\wv2" -Force
          Get-Item "$env:RUNNER_TEMP\wv2\build\native\x64\WebView2LoaderStatic.lib" | Select-Object Length

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Encrypt payload
        run: node scripts/encrypt.js

      - name: Compile
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++17 /EHsc /utf-8 /O1 /Os /MT /DUNICODE /D_UNICODE /DNDEBUG ^
             /I "%RUNNER_TEMP%\wv2\build\native\include" ^
             src\main.cpp ^
             /link /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /INCREMENTAL:NO ^
             /OUT:dist\VerifyDemo.exe ^
             user32.lib gdi32.lib ole32.lib oleaut32.lib advapi32.lib bcrypt.lib ^
             "%RUNNER_TEMP%\wv2\build\native\x64\WebView2LoaderStatic.lib"

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = Get-Item dist\VerifyDemo.exe
          "{0}  {1:N0} B  ({2:N1} KB)" -f $exe.Name, $exe.Length, ($exe.Length / 1KB)
          if ($exe.Length -gt 3MB) { Write-Error "exe 超过 3MB：静态库或 CRT 被整包链入"; exit 1 }
          Write-Host '--- 明文泄漏检查（应无命中）---'
          $hits = Select-String -Path $exe.FullName -Pattern 'verifyBox','0.30000000000000004','loadingBox','我们怀疑你是人类' -SimpleMatch -ErrorAction SilentlyContinue
          if ($hits) { Write-Error 'exe 中出现明文页面内容'; exit 1 } else { Write-Host 'OK: 无可读页面内容' }

          Write-Host '--- UTF-16 中文串检查（验证 /utf-8 生效）---'
          $u16 = [Text.Encoding]::Unicode.GetString([IO.File]::ReadAllBytes($exe.FullName))
          foreach ($s in @('机器人验证','页面数据解密失败')) {
            if (-not $u16.Contains($s)) { Write-Error ("未找到 UTF-16 字符串: " + $s); exit 1 }
          }
          Write-Host 'OK: 中文提示串为正常 UTF-16'

      - name: Selftest (run decryption in the real binary)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path dist\VerifyDemo.exe) -ArgumentList '--selftest' -PassThru -Wait
          Write-Host ("--selftest 退出码: " + $p.ExitCode)
          if ($p.ExitCode -ne 0) { Write-Error "解密自检失败，退出码 $($p.ExitCode)"; exit 1 }
          Write-Host 'OK: 二进制内解密链路正常'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: verify-exe
          path: verify-build/dist/VerifyDemo.exe
          if-no-files-found: error
          retention-days: 7
