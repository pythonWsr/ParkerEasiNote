name: build-verify-exe

# 仅在 test 分支上构建；html 与构建配置都不进入 main
on:
  push:
    branches: [test]
    paths:
      - 'verify-build/**'
      - '.github/workflows/build-verify-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows portable exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: verify-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Encrypt payload (AES-256-GCM)
        run: node scripts/encrypt.js

      - name: Build portable exe
        run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List output
        run: Get-ChildItem dist -Recurse | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Verify asar contents
        run: |
          npx --yes asar list dist/win-unpacked/resources/app.asar
          Write-Host '--- 明文泄漏检查 ---'
          # 只检查页面独有内容：main.js 里的窗口标题「机器人验证」不算泄漏
          $hits = Select-String -Path dist/win-unpacked/resources/app.asar -Pattern 'verifyBox','0.30000000000000004','loadingBox' -SimpleMatch -ErrorAction SilentlyContinue
          $html = Get-ChildItem dist/win-unpacked/resources -Recurse -Filter *.html -ErrorAction SilentlyContinue
          if ($hits) { Write-Error 'asar 中出现明文页面片段'; exit 1 }
          if ($html) { Write-Error ('asar 目录存在明文 HTML: ' + ($html.FullName -join ', ')); exit 1 }
          Write-Host 'OK: asar 中无明文页面内容'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: verify-exe
          path: verify-build/dist/*.exe
          if-no-files-found: error
          retention-days: 7
