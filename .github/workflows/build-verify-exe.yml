name: build-verify-exe

# 仅在 test 分支上构建；直接加密打包 web/ 多文件目录（容器 EN10WEB/1），不再先生成单文件 HTML
# 说明：验证用的 VerifyDemo.exe 不再打包，只出正式产物
on:
  push:
    branches: [test]
    paths:
      - 'verify-build/**'
      - 'web/**'
      - '.github/workflows/build-verify-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WV2_VERSION: '1.0.2903.40'

jobs:
  build:
    name: Windows exe (WebView2)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: verify-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        working-directory: .
        shell: pwsh
        run: |
          $v = (Get-Content 'web/version.json' -Raw | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "web version: $v"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$env:WV2_VERSION/microsoft.web.webview2.$env:WV2_VERSION.nupkg"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wv2.nupkg"
          Copy-Item "$env:RUNNER_TEMP\wv2.nupkg" "$env:RUNNER_TEMP\wv2.zip"
          Expand-Archive "$env:RUNNER_TEMP\wv2.zip" -DestinationPath "$env:RUNNER_TEMP\wv2" -Force
          Get-Item "$env:RUNNER_TEMP\wv2\build\native\x64\WebView2LoaderStatic.lib" | Select-Object Length

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build EasiNote.exe (快捷白板10)
        shell: cmd
        run: build.bat easinote EasiNote.exe

      - name: Package artifact
        working-directory: .
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir dist -Force | Out-Null
          Copy-Item "verify-build\dist\EasiNote.exe" "dist\ParkerEasiNote-$env:VERSION.exe"

      - name: Verify artifact
        working-directory: .
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $fail = $false
          $markers = @('EN10_HANZI','drawing-board','快捷白板10 备课版','css/tokens.css')
          $u16 = @('快捷白板10')

          $exe = Get-Item "dist\ParkerEasiNote-$env:VERSION.exe"
          "{0}  {1:N0} B  ({2:N1} KB)" -f $exe.Name, $exe.Length, ($exe.Length / 1KB)
          Write-Host "::notice title=$($exe.Name) 体积::$([math]::Round($exe.Length/1KB,1)) KB"

          $text = [IO.File]::ReadAllBytes($exe.FullName)
          $utf8 = [Text.Encoding]::UTF8.GetString($text)
          foreach ($m in $markers) {
            if ($utf8.Contains($m)) { Write-Error ($exe.Name + ' 出现明文页面片段: ' + $m); $fail = $true }
          }
          $u16text = [Text.Encoding]::Unicode.GetString($text)
          foreach ($s in $u16) {
            if (-not $u16text.Contains($s)) { Write-Error ($exe.Name + ' 缺少 UTF-16 字符串: ' + $s); $fail = $true }
          }
          if ($fail) { exit 1 }
          Write-Host 'OK: 体积已记录、无明文泄漏、UTF-16 中文串正常'

      - name: Selftest (decryption + container inside the real binary)
        working-directory: .
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $p = Start-Process -FilePath (Resolve-Path "dist\ParkerEasiNote-$env:VERSION.exe") -ArgumentList '--selftest' -PassThru -Wait
          Write-Host ("--selftest 退出码: {0}" -f $p.ExitCode)
          if ($p.ExitCode -ne 0) { Write-Error '解密/容器自检失败'; exit 1 }
          Write-Host 'OK: 解密与 EN10WEB 容器解析正常'

      - name: Upload EasiNote
        uses: actions/upload-artifact@v4
        with:
          name: ParkerEasiNote-${{ steps.ver.outputs.version }}-exe
          path: dist/ParkerEasiNote-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 7
