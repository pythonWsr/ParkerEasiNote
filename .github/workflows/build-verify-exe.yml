name: build-verify-exe

# 仅在 test 分支上构建；页面与构建配置都不进入 main
# 说明：验证用的 VerifyDemo.exe 不再打包，只出正式产物 EasiNote.exe
on:
  push:
    branches: [test]
    paths:
      - 'verify-build/**'
      - 'web/**'
      - 'tools/bundle_html.py'
      - '.github/workflows/build-verify-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WV2_VERSION: '1.0.2903.40'

jobs:
  build:
    name: Windows exe (WebView2)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: verify-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bundle single-file HTML
        working-directory: .
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/bundle_html.py --out 快捷白板10.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$env:WV2_VERSION/microsoft.web.webview2.$env:WV2_VERSION.nupkg"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wv2.nupkg"
          Copy-Item "$env:RUNNER_TEMP\wv2.nupkg" "$env:RUNNER_TEMP\wv2.zip"
          Expand-Archive "$env:RUNNER_TEMP\wv2.zip" -DestinationPath "$env:RUNNER_TEMP\wv2" -Force
          Get-Item "$env:RUNNER_TEMP\wv2\build\native\x64\WebView2LoaderStatic.lib" | Select-Object Length

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build EasiNote.exe (快捷白板10)
        shell: cmd
        run: build.bat easinote EasiNote.exe

      - name: Verify artifact
        shell: pwsh
        run: |
          $fail = $false
          $markers = @('EN10_HANZI','drawing-board','快捷白板10 备课版')
          $u16 = @('快捷白板10')

          $exe = Get-Item 'dist\EasiNote.exe'
          "{0}  {1:N0} B  ({2:N1} KB)" -f $exe.Name, $exe.Length, ($exe.Length / 1KB)
          Write-Host "::notice title=$($exe.Name) 体积::$([math]::Round($exe.Length/1KB,1)) KB"

          $text = [IO.File]::ReadAllBytes($exe.FullName)
          $utf8 = [Text.Encoding]::UTF8.GetString($text)
          foreach ($m in $markers) {
            if ($utf8.Contains($m)) { Write-Error ($exe.Name + ' 出现明文页面片段: ' + $m); $fail = $true }
          }
          $u16text = [Text.Encoding]::Unicode.GetString($text)
          foreach ($s in $u16) {
            if (-not $u16text.Contains($s)) { Write-Error ($exe.Name + ' 缺少 UTF-16 字符串: ' + $s); $fail = $true }
          }
          if ($fail) { exit 1 }
          Write-Host 'OK: 体积已记录、无明文泄漏、UTF-16 中文串正常'

      - name: Selftest (decryption inside the real binary)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist\EasiNote.exe') -ArgumentList '--selftest' -PassThru -Wait
          Write-Host ("EasiNote.exe --selftest 退出码: {0}" -f $p.ExitCode)
          if ($p.ExitCode -ne 0) { Write-Error 'EasiNote.exe 解密自检失败'; exit 1 }
          Write-Host 'OK: 解密链路正常'

      - name: Upload EasiNote
        uses: actions/upload-artifact@v4
        with:
          name: easinote-exe
          path: verify-build/dist/EasiNote.exe
          if-no-files-found: error
          retention-days: 7
