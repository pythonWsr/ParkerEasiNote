name: build-ipa

# 仅在 test 分支构建；直接打包 web/ 多文件目录；未签名 ipa，仅用于结构验证与后续重签
on:
  push:
    branches: [test]
    paths:
      - 'mobile-build/ios/**'
      - 'web/**'
      - 'assets/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: iOS IPA (unsigned, WKWebView shell)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('web/version.json',encoding='utf-8'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "web version: $V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build unsigned IPA
        run: bash mobile-build/ios/build.sh

      - name: Package artifact
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          cp mobile-build/ios/build/EasiNote.ipa "dist/ParkerEasiNote-${VERSION}.ipa"

      - name: Verify IPA
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          IPA="dist/ParkerEasiNote-${VERSION}.ipa"
          SIZE=$(stat -f%z "$IPA")
          echo "IPA: $IPA  ${SIZE} B ($((SIZE/1024)) KB)"
          echo "::notice title=IPA 体积::${SIZE} B ($((SIZE/1024)) KB)"
          unzip -l "$IPA" | grep -E 'Payload/EasiNote\.app/(EasiNote|Info\.plist|www/index\.html|www/js/app\.js|www/vendor/)'
          file mobile-build/ios/build/EasiNote.app/EasiNote
          plutil -lint mobile-build/ios/build/EasiNote.app/Info.plist
          unzip -p "$IPA" Payload/EasiNote.app/www/index.html | grep -q 'ParkerEasiNote10' && echo "OK: 多文件页面已打入 www"
          unzip -p "$IPA" Payload/EasiNote.app/www/index.html | grep -q 'css/tokens.css' && echo "OK: 子资源引用保留（未内联）"

          # 图标：必须真的打进包，否则侧载后是白图标
          unzip -l "$IPA" | grep -q 'Payload/EasiNote.app/AppIcon60x60@2x.png' \
            || { echo "缺少 AppIcon60x60@2x.png（会显示白图标）"; exit 1; }
          ICONS=$(unzip -l "$IPA" | grep -c 'Payload/EasiNote.app/AppIcon.*\.png' || true)
          echo "图标数量: $ICONS"
          [ "$ICONS" -ge 8 ] || { echo "图标数量不足: $ICONS"; exit 1; }

          # 权限声明：与 Android 的 CAMERA / RECORD_AUDIO / WRITE_EXTERNAL_STORAGE 映射
          for K in NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryAddUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$K" mobile-build/ios/build/EasiNote.app/Info.plist >/dev/null \
              || { echo "缺少权限说明: $K"; exit 1; }
          done
          echo "OK: 图标与权限声明齐全"
          echo "OK: IPA 结构正常（未签名，多文件形式）"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ParkerEasiNote-${{ steps.ver.outputs.version }}-ipa
          path: dist/ParkerEasiNote-${{ steps.ver.outputs.version }}.ipa
          if-no-files-found: error
          retention-days: 7
