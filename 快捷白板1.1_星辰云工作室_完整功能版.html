<style>
/* ===== 基础重置 ===== */
*,*::before,*::after{-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0F261E;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
:root{--glass-bg:rgba(255,255,255,.15);--glass-border:rgba(255,255,255,.3);--primary:#2DC360;--radius:24px;--tool-radius:28px}

/* ===== 毛玻璃 ===== */
.glass{background-color:rgba(255,255,255,.15);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--glass-border);box-shadow:none!important}
.dark-glass{background-color:rgba(20,20,20,.65)!important;border-color:rgba(255,255,255,.1)!important;color:#fff!important}
@supports not ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){.glass{background-color:rgba(28,42,60,.95)} .dark-glass{background-color:rgba(20,20,20,.95)!important}}

/* ===== 动画 ===== */
@keyframes fadeSlideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeSlideUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-16px)}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes popOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(10px) scale(.96)}}

/* ===== 画布与背景 ===== */
#app{position:relative;width:100%;height:100%;overflow:hidden;background-color:#0F261E}
#bg-layer{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background-color:transparent;transition:background .3s}
#bg-layer video{width:100%;height:100%;object-fit:contain;display:block}
#bg-layer .ppt-viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;}
#bg-layer .ppt-stage{position:absolute;top:50%;left:50%;transform-origin:center center;background:#fff;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,0.6);}
#bg-layer .ppt-stage .shape { position:absolute; overflow:hidden; box-sizing:border-box; display:none; }
#bg-layer .ppt-stage .shape.visible { display:block; }
#bg-layer .ppt-stage .text-inner { display:table; width:100%; height:100%; }
#bg-layer .ppt-stage .text-cell { display:table-cell; width:100%; height:100%; }
#drawing-board{position:absolute;inset:0;z-index:2;cursor:crosshair;touch-action:none;background:transparent;}

/* ===== 橡皮光标（白底灰边） ===== */
#eraser-cursor{
    position:fixed; pointer-events:none; 
    border:2px solid #999; 
    background:#fff; 
    z-index:999; display:none; box-sizing:border-box; 
    border-radius:50%; 
    transform:translate(-50%,-50%); 
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    opacity: 0.85;
}

/* ===== 顶部时间+页码 纯文字 ===== */
#top-right{position:fixed;top:16px;right:20px;z-index:100;display:flex;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:none;transition:transform .3s;transform-origin:top right;}
#clock{font-size:18px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer;pointer-events:auto;transition:opacity .2s}
html.light-ui #clock{color:#16202c;text-shadow:0 1px 2px rgba(255,255,255,.85)}
html.light-ui #page-indicator{color:rgba(22,32,44,.62);text-shadow:0 1px 2px rgba(255,255,255,.8)}
#clock:hover{opacity:.75}
#page-indicator{font-size:13px;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.5)}

/* ===== 底部主工具栏 (锁死胶囊，自适应滑动) ===== */
#bottom-toolbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;height:56px !important;padding:4px;border-radius:var(--tool-radius) !important;z-index:100;transition:transform .3s, opacity .3s;will-change:transform}
.tool-indicator{position:absolute;top:4px;left:0;height:48px !important;border-radius:24px !important;background:rgba(45,195,96,.85);transition:transform .35s cubic-bezier(.34,1.56,.64,1),width .35s cubic-bezier(.34,1.56,.64,1),opacity .3s;z-index:0;pointer-events:none;will-change:transform,width}
.tool-btn{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:48px !important;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;transition:color .2s, opacity .3s, width .3s, padding .3s, margin .3s, transform .15s cubic-bezier(.34,1.56,.64,1);outline:none;padding:0;border-radius:24px !important;flex-shrink:0;will-change:transform;-webkit-tap-highlight-color:transparent}
.dark-glass .tool-btn{color:rgba(255,255,255,.6)}
.tool-btn i{font-size:18px;margin-bottom:1px;pointer-events:none}
.tool-btn span{font-size:9.5px;line-height:1;pointer-events:none}
.tool-btn.active{color:#fff}
.tool-btn:active{transform:scale(.88)}

/* ===== 左下角 ===== */
#bottom-left{position:fixed;bottom:22px;left:20px;z-index:100;display:flex;flex-direction:row;gap:8px;align-items:center;height:56px;transition:transform .3s;transform-origin:bottom left;}
html.light-ui .left-fab{color:#16202c}
html.light-ui .left-fab.on{color:#fff}
html.light-ui .page-btn{color:#16202c}
html.light-ui .tool-btn{color:rgba(22,32,44,.62)}
html.light-ui .tool-btn.active{color:#0d7a38}
.left-fab{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;cursor:pointer;border:none;outline:none;transition:transform .2s,background .2s,opacity .3s,width .3s;background-color:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-border);flex-shrink:0;}
.dark-glass.left-fab{background-color:rgba(20,20,20,.65);border-color:rgba(255,255,255,.1)}
.left-fab:active{transform:scale(.88)}
.left-fab.on{background-color:rgba(45,195,96,.7)}

#left-menu-panel{position:fixed;bottom:90px;left:20px;z-index:200;display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:18px;min-width:180px;opacity:0;transform:translateY(12px) scale(.96);pointer-events:none;transition:opacity .25s,transform .25s;background-color:rgba(30,42,55,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15)}

/* ===== 右下角 ===== */

.page-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;cursor:pointer;border:none;background:transparent;transition:background .2s,transform .15s}

.page-btn:hover{background:rgba(255,255,255,.15)}
.page-btn:active{transform:scale(.88)}

/* ===== 二级菜单 ===== */
#submenu{position:fixed;left:12px;right:12px;bottom:88px;z-index:300;display:none;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;border-radius:22px;background:rgba(24,34,46,.92);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 34px rgba(0,0,0,.36);animation:subUp .26s cubic-bezier(.16,1,.3,1) forwards;color:#fff}
#submenu.hide{animation:subDown .2s ease forwards}
@keyframes subUp{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes subDown{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(14px) scale(.98)}}
#submenu .sub-title{font-size:12px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:6px;padding:0 2px}

.pen-colors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.swatch{width:34px;height:34px;border-radius:10px;cursor:pointer;position:relative;border:2px solid transparent;transition:border-color .2s,transform .15s}
.swatch:active{transform:scale(.85)}
.swatch.active{border-color:#fff}
.swatch.active::after{content:'\f00c';font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:11px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}

.pen-slider{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.25);outline:none}
.pen-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer;border:2px solid var(--primary)}

.sub-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:13px;cursor:pointer;text-align:left;width:100%;transition:background .2s;font-family:inherit;white-space:nowrap}
.sub-btn:hover{background:rgba(255,255,255,.18)}
.sub-btn.danger{color:#ff6b6b;border-color:rgba(255,107,107,.3)}
.sub-btn i{width:16px;text-align:center}

.toggle{display:inline-flex;align-items:center;cursor:pointer;font-size:13px;gap:8px}
.toggle input{display:none}
.toggle-track{position:relative;width:40px;height:22px;background:rgba(255,255,255,.2);border-radius:11px;transition:background .25s;border:1px solid rgba(255,255,255,.2);flex-shrink:0}
.toggle-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.toggle input:checked+.toggle-track{background:var(--primary);border-color:var(--primary)}
.toggle input:checked+.toggle-track .toggle-thumb{transform:translateX(18px)}

.shape-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shape-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);cursor:pointer;color:#fff;font-size:11px;transition:background .2s}

/* ===== 选择浮动条 ===== */
#selection-bar{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:400;display:none;gap:8px;padding:8px;border-radius:16px;background:rgba(30,42,55,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);animation:popIn .2s}

/* ===== 底部抽屉（所有弹窗共用） ===== */
.modal-overlay{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,10,18,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}

/* ===== Toast ===== */
#toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:20000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:90vw}

/* ===== 窄屏警告 ===== */
/* ===== 大号时间 ===== */

/* ===== 右侧抽屉 ===== */
.drawer-overlay{position:fixed;inset:0;z-index:8500;background:rgba(4,10,18,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}

/* 自绘 SVG 图标通用样式（无 CDN，教室断网可用） */
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.125em;flex-shrink:0;
     fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ico-spin{animation:icoSpin 1s linear infinite}
@keyframes icoSpin{to{transform:rotate(360deg)}}
.tool-btn .ico{width:20px;height:20px;margin-bottom:3px}
.left-fab .ico{width:24px;height:24px}
.page-btn .ico{width:20px;height:20px}
.menu-item .ico{width:18px;height:18px}

/* ═══════════════════════════════════════════════════════════
   真·液态玻璃（与 Android 1.1 最终定稿同一定性，网页原生增强）

   · 中心透出背后、边缘一圈折射亮环 + 液滴弧形高光 + 亮湿边；
   · 网页比 APK 多一步：用浏览器原生 backdrop-filter 把「背后的
     白板底色 / 课件 / 板书」真的揉开 —— 这是系统合成，不截屏、
     不取景、不算坐标，绝不会出现 APK 真机上那种白饼或黑条
     （APK 的离屏取景方案已在翻车后撤除）；
   · 玻璃自身的文字与图标是元素内容，不受 backdrop-filter 影响，
     始终锐利 —— 与参考图「糊的是背景、清的是控件」一致。
   ═══════════════════════════════════════════════════════════ */
:root{
  --glass-blur:blur(10px) saturate(135%) brightness(1.06);
  --glass-edge:rgba(190,232,255,.42);
  --glass-core:rgba(255,255,255,.045);
  --glass-ring:rgba(190,232,255,.075);
  --glass-top:rgba(255,255,255,.55);
  --glass-shadow:rgba(0,0,0,.28);
  --glass-txt:rgba(255,255,255,.76);
}
html.light-ui{
  --glass-blur:blur(10px) saturate(128%) brightness(1.02);
  --glass-edge:rgba(112,164,198,.55);
  --glass-core:rgba(224,240,252,.10);   /* 中心只留极淡冷蓝，别铺成一整块淡蓝板 */
  --glass-ring:rgba(255,255,255,.30);
  --glass-top:rgba(255,255,255,.95);
  --glass-shadow:rgba(20,30,42,.18);
  --glass-txt:rgba(22,32,44,.62);
}

/* 主界面玻璃：任务栏 / 圆钮 / 翻页条 / 二级面板 / 提示 */
#bottom-toolbar,#bottom-right,.left-fab,#selection-bar,.toast,.chip,.mini-btn{
    background-color:var(--glass-core)!important;
    -webkit-backdrop-filter:var(--glass-blur)!important;
    backdrop-filter:var(--glass-blur)!important;
    border:1px solid var(--glass-edge)!important;
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.10),
        inset 0 0 0 6px var(--glass-ring),
        inset 0 0 0 16px rgba(190,232,255,.035),
        inset 0 1px 0 var(--glass-top),
        inset 0 -12px 20px -12px var(--glass-shadow),
        0 6px 24px rgba(0,0,0,.10)!important;
    background-image:
        radial-gradient(ellipse 46% 30% at 42% -6%, rgba(255,255,255,.34), rgba(255,255,255,0) 74%),
        linear-gradient(140deg, rgba(255,255,255,.10), rgba(255,255,255,0) 46%),
        linear-gradient(to bottom, rgba(255,255,255,.06), rgba(255,255,255,0) 26%, rgba(255,255,255,0) 74%, rgba(0,0,0,.09));
    background-repeat:no-repeat;
    background-size:160% 100%,100% 100%,100% 100%;
    background-position:30% 0,0 0,0 0;
    animation:lensDrift 7.2s ease-in-out infinite alternate;
}
@keyframes lensDrift{from{background-position:26% 0,0 0,0 0}to{background-position:62% 0,0 0,0 0}}
.dark-glass{background-color:var(--glass-core)!important;border-color:var(--glass-edge)!important}

/* 浅底折射边：纯白环叠在白底上看不见，改淡冷蓝，玻璃感与可读性都在 */
html.light-ui #bottom-toolbar,html.light-ui #bottom-right,
html.light-ui .left-fab:not(.on),html.light-ui .toast,
html.light-ui .chip:not(.on),html.light-ui .mini-btn{
    border-color:rgba(112,164,198,.55)!important;
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.70),
        inset 0 0 0 6px rgba(255,255,255,.30),
        inset 0 0 0 16px rgba(255,255,255,.14),
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -12px 20px -12px rgba(20,30,42,.18),
        0 6px 24px rgba(20,30,42,.10)!important;
}

/* 弹层：遮罩不整屏糊（省性能、避免灰板），面板给适度半透明底 + 轻模糊。
   纯透明弹层会透出暗遮罩/白板，字看不清 —— 这是真机翻车同源问题。 */
.modal-overlay,.drawer-overlay{
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    background-color:rgba(4,10,18,.30)!important;
}
#left-menu-panel,#submenu,.sheet,.drawer{
    background-color:rgba(18,30,42,.72)!important;
    -webkit-backdrop-filter:blur(16px) saturate(130%)!important;
    backdrop-filter:blur(16px) saturate(130%)!important;
    border:1px solid var(--glass-edge)!important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 -8px 30px rgba(0,0,0,.18)!important;
}
html.light-ui #left-menu-panel,html.light-ui #submenu,
html.light-ui .sheet,html.light-ui .drawer{
    background-color:rgba(250,252,255,.84)!important;
    border-color:rgba(112,164,198,.50)!important;
}

/* 主菜单 / 目录：底部滑出抽屉（与 Android 定稿一致） */
#left-menu-panel{
    left:0!important;right:0!important;bottom:0!important;top:auto!important;
    width:auto!important;min-width:0!important;
    border-radius:22px 22px 0 0!important;
    padding:8px 12px calc(12px + env(safe-area-inset-bottom))!important;
    gap:2px;opacity:1;transform:translateY(110%);
    transition:transform .28s cubic-bezier(.16,1,.3,1);
    z-index:8600;
}
#left-menu-panel.open{transform:translateY(0);opacity:1;pointer-events:auto}
.menu-grip{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.34);margin:2px auto 8px}
html.light-ui .menu-grip{background:rgba(20,30,42,.22)}
.menu-title{font-size:15px;font-weight:700;padding:2px 8px 10px;border-bottom:1px solid rgba(255,255,255,.10);margin-bottom:6px}
html.light-ui .menu-title{border-bottom-color:rgba(20,30,42,.09)}
.drawer{
    top:auto!important;bottom:0!important;left:0!important;right:0!important;
    width:auto!important;height:min(70vh,560px)!important;
    border-radius:22px 22px 0 0!important;border-left:none!important;
    transform:translateY(110%)!important;
    transition:transform .28s cubic-bezier(.16,1,.3,1);
}
.drawer.open{transform:translateY(0)!important}
.drawer-head{padding-top:16px}

/* 工具栏精修：绿块内缩玻璃胶囊、文字层次、图标加大 */
.tool-indicator{
    box-sizing:border-box!important;
    border:2px solid transparent!important;
    background:linear-gradient(180deg,rgba(60,210,120,.92),rgba(28,150,80,.92)) padding-box!important;
    background-clip:padding-box!important;
    border-radius:22px!important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -8px 14px rgba(0,0,0,.12),0 0 0 1px rgba(150,245,190,.45)!important;
}
.tool-btn{color:var(--glass-txt)}
.dark-glass .tool-btn{color:var(--glass-txt)}
.tool-btn span{font-size:11px;line-height:1.1}
.tool-btn.active{color:#fff}
.tool-btn.active span{font-weight:700}
html.light-ui .tool-btn.active{color:#0d7a38}

/* 左下圆钮留 4px 呼吸；翻页条细分隔 */
#bottom-left{gap:4px}
body.compact-ui #bottom-left{gap:4px}
.pg-sep{width:1px;height:20px;background:rgba(255,255,255,.28);margin:0 3px;flex-shrink:0}
html.light-ui .pg-sep{background:rgba(20,30,42,.18)}
body.compact-ui .pg-sep{height:18px;margin:0 2px}

/* 激活态必须绿色实心：浅底激活圆钮曾被旧规则压成「白饼」，这里统一兜住 */
.left-fab.on,.chip.on{
    background-color:rgba(45,195,96,.90)!important;
    border-color:rgba(150,245,190,.72)!important;
    color:#fff!important;
}
html.light-ui #bottom-left .left-fab.on,
html.light-ui #bottom-left .left-fab.on:hover,
html.light-ui .chip.on{
    background-color:rgba(45,195,96,.90)!important;
    border-color:rgba(150,245,190,.72)!important;
    color:#fff!important;
}
html.light-ui #bottom-left .left-fab.on .ico path{stroke:#fff!important}
html.light-ui .toast{background-color:rgba(250,252,255,.92)!important}
html.light-ui .mini-btn,
html.light-ui .sheet-foot .btn-cancel{background-color:rgba(20,30,42,.055)!important}

/* 覆盖原主题表里的旧浅底玻璃规则（其选择器带 html.light-ui + ID，优先级更高）。
   统一走变量，避免多处 !important 互相打架。 */
html.light-ui #bottom-toolbar,html.light-ui #bottom-right,
html.light-ui #bottom-left .left-fab:not(.on){
    background-color:var(--glass-core)!important;
    -webkit-backdrop-filter:var(--glass-blur)!important;
    backdrop-filter:var(--glass-blur)!important;
    border-color:var(--glass-edge)!important;
}
html.light-ui .tool-indicator{
    border:2px solid transparent!important;
    background:linear-gradient(180deg,rgba(60,210,120,.95),rgba(28,150,80,.92)) padding-box!important;
    background-clip:padding-box!important;
    border-radius:22px!important;
}

/* 不支持 backdrop-filter 的老浏览器：退回半透明实心底，不空白、不黑条 */
@supports not ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){
  #bottom-toolbar,#bottom-right,.left-fab,#selection-bar,.toast,.chip,.mini-btn{
    background-color:rgba(24,36,50,.90)!important;
  }
  html.light-ui #bottom-toolbar,html.light-ui #bottom-right,
  html.light-ui .left-fab,html.light-ui .toast,html.light-ui .chip,html.light-ui .mini-btn{
    background-color:rgba(250,252,255,.94)!important;
  }
  #left-menu-panel,#submenu,.sheet,.drawer{background-color:rgba(18,30,42,.96)!important}
  html.light-ui #left-menu-panel,html.light-ui #submenu,
  html.light-ui .sheet,html.light-ui .drawer{background-color:rgba(250,252,255,.97)!important}
}


/* ═══════════════════════════════════════════════════════════
   [IMPORT-FIX] 放映课件 + 拖放导入
   · 白课件上，原来的半透明玻璃几乎全透、工具文字又是白色，
     结果整条任务栏「消失」，只剩绿胶囊上「画笔」两个字 ——
     看起来就像课件没解析出来。ppt-mode 下把玻璃锁成深色。
   · 不改动白板本体、不改动任何布局坐标。
   ═══════════════════════════════════════════════════════════ */
body.ppt-mode{
    --glass-core:rgba(16,26,36,.84);
    --glass-edge:rgba(190,232,255,.42);
    --glass-ring:rgba(190,232,255,.10);
    --glass-txt:rgba(255,255,255,.88);
    --glass-top:rgba(255,255,255,.55);
    --glass-shadow:rgba(0,0,0,.35);
}
body.ppt-mode .tool-btn,body.ppt-mode .page-btn,body.ppt-mode .left-fab{
    color:rgba(255,255,255,.88)!important;
}
body.ppt-mode .tool-btn.active,body.ppt-mode .left-fab.on{color:#fff!important}
body.ppt-mode .pg-sep{background:rgba(255,255,255,.30)}

.menu-hint{font-size:11px;line-height:1.55;opacity:.58;padding:0 8px 8px;color:#fff}
html.light-ui .menu-hint{color:#16202c}

#drop-hint{
    position:fixed;inset:0;z-index:30000;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:12px;
    background:rgba(8,20,16,.74);color:#fff;font-size:21px;font-weight:700;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    pointer-events:none;letter-spacing:.5px;text-align:center;padding:24px;
}
#drop-hint .dh-sub{font-size:13px;font-weight:400;opacity:.82;line-height:1.6}
body.dragging #drop-hint{display:flex}

/* 统一 XML 入口：剥 BOM、去掉与已解码字符串冲突的声明、parsererror 兜底。
   真实希沃课件的 Board.xml / Slide_0.xml 常带 UTF-8 BOM 且没有 <?xml?> 声明，
   个别版本还写 gb2312，DOMParser 直接吃会整份解析失败。 */
function xmlDoc(text){
    if(!text || typeof text !== 'string') return null;
    let t = text.replace(/^\uFEFF/, '').replace(/^\uFFFE/, '');
    t = t.replace(/^\s*<\?xml[^>]*\?>/i, '').replace(/^\s+/, '');
    try {
        const d = new DOMParser().parseFromString(t, 'text/xml');
        if(!d || d.getElementsByTagName('parsererror').length) return null;
        return d;
    } catch(e) { return null; }
}

const S = {

    pages: [{ bg: '#0F261E', bgId: 'deep', bgId: 'deep', elements: [] }],

};

/* ── 模块 1 / 背景色预设与界面主题 ───────────────────────── */
const BG_PRESETS = [
    { id:'deep',  name:'墨绿', css:'#0F261E', icon:'fa-mountain-sun' },
    { id:'white', name:'纯白', css:'#FFFFFF', icon:'fa-sun' },
    { id:'dark',  name:'深灰', css:'#1B1B1F', icon:'fa-moon' },
    { id:'paper', name:'米黄', css:'#F7F3E9', icon:'fa-scroll' },
    { id:'blue',  name:'深蓝', css:'#10243F', icon:'fa-water' }
];
const LIGHT_BG_IDS = { white:true, paper:true };
function isLightBgId(id){ return !!LIGHT_BG_IDS[id]; }
function bgCssOf(id){
    const p = BG_PRESETS.filter(b=>b.id===id)[0];
    return p ? p.css : '#0F261E';
}
function currentBgId(){
    let id = (S.pages[S.pageIdx] && S.pages[S.pageIdx].bgId) || 'deep';
    if(!BG_PRESETS.filter(b=>b.id===id).length) id = 'deep';
    return id;
}
function setBoardBg(id, opt){
    if(S.mode==='ppt'){ toast('课件模式下请在白板中切换背景','fa-exclamation-triangle'); return; }
    const preset = BG_PRESETS.filter(b=>b.id===id)[0];
    if(!preset) return;
    S.pages.forEach(p=>{ p.bgId = id; p.bg = preset.css; });
    S.bgId = id;
    updateBg(); redraw(); updatePageInd(); updatePageThumbnails();
    applyChromeTheme();
    if(opt && opt.toast) toast('背景已切换：' + preset.name,'fa-check');
}
function applyChromeTheme(){
    // 白板本体之外的界面随底色切换深浅皮肤
    const light = (S.mode==='whiteboard') && isLightBgId(currentBgId());
    document.documentElement.classList.toggle('light-ui', light);
    ['toolbar','right'].forEach(k=>D[k].classList.toggle('dark-glass', !light));
    D.left.querySelectorAll('.left-fab').forEach(el=>el.classList.toggle('dark-glass', !light));
    const sb = $('btn-save');
    if(sb && S.mode!=='ppt'){ sb.style.background=''; sb.style.borderColor=''; }
    const tag = $('menu-bg-tag');
    if(tag){
        const light = (S.mode==='whiteboard') && isLightBgId(currentBgId());
        tag.textContent = S.mode==='ppt' ? '放映中' : (currentBgId()==='white' ? '白底' : (light ? '浅底' : '深底'));
    }
    const t = $('btn-bg-white');
    if(t){
        const on = currentBgId()==='white';
        t.classList.toggle('on', on);
        t.innerHTML = '<i class="fas ' + (on?'fa-moon':'fa-sun') + '"></i>';
    }
}

/* ── 模块 2 / DOM 引用与画布上下文 ────────────────────────── */
const $ = id => document.getElementById(id);
const D = {
    app: $('app'), bg: $('bg-layer'), canvas: $('drawing-board'), cursor: $('eraser-cursor'),
    clock: $('clock'), pageInd: $('page-indicator'),
    toolbar: $('bottom-toolbar'), indicator: $('tool-indicator'), left: $('bottom-left'), right: $('bottom-right'),
    leftMenu: $('left-menu-panel'), submenu: $('submenu'), selBar: $('selection-bar'),
    toast: $('toast-container'),
    bigTime: $('big-time'), bigVal: $('big-time-val'), bigDate: $('big-time-date'),
    drawerOverlay: $('drawer-overlay'), drawer: $('drawer'), drawerBody: $('drawer-body'),
    modalRoot: $('modal-root'), fileImage: $('file-image'), filePpt: $('file-ppt'), fileEnbx: $('file-enbx')
};
const ctx = D.canvas.getContext('2d');
let DPR = window.devicePixelRatio || 1;
let CW = 0, CH = 0;

function toast(msg, icon='fa-info-circle'){
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<i class="fas ${icon}"></i><span>${msg}</span>`;
    D.toast.appendChild(el);
    setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),300); }, 2200);
}

/* ── 模块 3 / 底部抽屉与通用弹窗 ──────────────────────────── */
function openModal(opts){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const actions = opts.actions || [{ id:'close', label:'确定', type:'confirm' }];
    const actHtml = actions.map(a => {
        const cls = a.type==='confirm' ? 'btn-confirm' : 'btn-cancel';
        const ico = a.icon || (a.type==='confirm' ? 'fa-check' : 'fa-times');
        return `<button class="btn ${cls}" data-act="${a.id}"><i class="fas ${ico}"></i>${a.label}</button>`;
    }).join('');
    const icon = opts.icon || 'fa-circle-info';
    overlay.innerHTML = `
        <div class="sheet ${opts.cls||''}" role="dialog">
            <div class="sheet-grip"></div>
            <div class="sheet-head">
                <span class="sh-title"><i class="fas ${icon}"></i>${opts.title||'提示'}</span>
                <button class="sh-close" data-act="__close" title="关闭"><i class="fas fa-times"></i></button>
            </div>
            <div class="sheet-body">${opts.content||''}</div>
            <div class="sheet-foot">${actHtml}</div>
        </div>`;
    D.modalRoot.appendChild(overlay);
    requestAnimationFrame(()=>overlay.classList.add('open'));
    overlay.querySelectorAll('[data-act]').forEach(btn=>{
        btn.onclick = (e)=>{
            e.stopPropagation();
            if(btn.dataset.act === '__close'){ closeModal(overlay); return; }
            const act = actions.find(a=>a.id===btn.dataset.act) || { id:'close' };
            if(act.callback) act.callback(overlay);
            else closeModal(overlay);
        };
    });
    overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(overlay); });
    return overlay;
}
function closeModal(overlay){
    overlay.classList.remove('open');
    setTimeout(()=>overlay.remove(), 300);
}

/* ── 模块 4 / 画布尺寸、页面状态与重绘 ────────────────────── */
function resizeCanvas(){
    const r = D.app.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    CW = r.width; CH = r.height;
    D.canvas.style.width = CW+'px';
    D.canvas.style.height = CH+'px';
    D.canvas.width = Math.floor(CW*DPR);
    D.canvas.height = Math.floor(CH*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    redraw();
    scalePPT();
}

function getElements(){
    if(S.mode==='ppt' && S.ppt && S.ppt.slides[S.slideIdx]) return S.ppt.slides[S.slideIdx].elements;
    return S.pages[S.pageIdx].elements;
}
function setElements(arr){
    if(S.mode==='ppt' && S.ppt && S.ppt.slides[S.slideIdx]) S.ppt.slides[S.slideIdx].elements = arr;
    else S.pages[S.pageIdx].elements = arr;
}
function getBg(){
    if(S.mode==='ppt') return '#ffffff';
    if(S.mode==='camera') return '#000000';
    const pg = S.pages[S.pageIdx];
    return (pg && pg.bg) || bgCssOf(currentBgId());
}

function isLightBg(){
    if(S.mode==='ppt') return true;
    if(S.mode==='camera') return false;
    return isLightBgId(currentBgId());
}

/* ── 模块 5 / 笔迹与元素绘制 ──────────────────────────────── */
function redraw(){
    ctx.clearRect(0,0,CW,CH);
    const els = getElements();
    if(!els) return;
    
    for(const el of els){
        ctx.save();
        if(el.type==='eraser'){
            ctx.globalCompositeOperation = 'destination-out';
            drawEraserStroke(el);
        } else if(el.type==='pen'){
            ctx.globalCompositeOperation = 'source-over';
            drawInkStroke(el);
        } else if(el.type==='image' && el.img && el.img.complete && el.img.naturalWidth){
            ctx.globalCompositeOperation = 'source-over';
            ctx.drawImage(el.img, el.x, el.y, el.w, el.h);
        } else if(el.type==='shape'){
            ctx.globalCompositeOperation = 'source-over';
            drawShapeEl(el);
        } else if (el.type === 'mask') {
            ctx.globalCompositeOperation = 'source-over';
            if (!el.points || el.points.length < 3) { ctx.restore(); continue; }
            ctx.beginPath();
            ctx.moveTo(el.points[0].x, el.points[0].y);
            for (let i = 1; i < el.points.length; i++) ctx.lineTo(el.points[i].x, el.points[i].y);
            ctx.closePath();
            ctx.fillStyle = el.color || getBg();
            ctx.fill();
        }
        ctx.restore();
    }
    
    if(S.selection.lassoPoints && S.selection.lassoPoints.length>1){
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(S.selection.lassoPoints[0].x, S.selection.lassoPoints[0].y);
        for(let i=1;i<S.selection.lassoPoints.length;i++) ctx.lineTo(S.selection.lassoPoints[i].x, S.selection.lassoPoints[i].y);
        ctx.strokeStyle = '#2DC360';
        ctx.lineWidth = 2;
        ctx.setLineDash([8,5]);
        ctx.stroke();
        ctx.restore();
    }
    
    drawSelectionOverlay();
}

function drawInkStroke(el){
    const pts = el.pointsWithPressure || el.points;
    if(!pts || pts.length===0) return;
    
    ctx.setLineDash([]); 
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = el.color;
    ctx.fillStyle = el.color;

    if(pts.length===1){
        ctx.beginPath();
        ctx.arc(pts[0].x, pts[0].y, Math.max(0.5, el.thickness/2 * 0.5), 0, Math.PI*2);
        ctx.fill();
        return;
    }
    
    const totalPts = pts.length;
    for(let i=0; i<totalPts-1; i++){
        const p1 = pts[i], p2 = pts[i+1];
        
        let pr1 = (p1.pressure != null && !isNaN(p1.pressure)) ? p1.pressure : 0.5;
        let pr2 = (p2.pressure != null && !isNaN(p2.pressure)) ? p2.pressure : 0.5;
        
        const segmentProgress = i / (totalPts - 1);
        let taperFactor = 1;
        if (segmentProgress > 0.85) {
            taperFactor = 1 - ((segmentProgress - 0.85) / 0.15) * 0.55;
        }
        
        let w1 = Math.max(0.8, el.thickness * (0.35 + pr1 * 0.85) * taperFactor);
        let w2 = Math.max(0.8, el.thickness * (0.35 + pr2 * 0.85) * taperFactor);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineWidth = w2;
        ctx.stroke();

        if (i > 0) {
            ctx.beginPath();
            ctx.arc(p1.x, p1.y, w1 / 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function drawEraserStroke(el){
    const pts = el.points;
    if(!pts || pts.length===0) return;
    const size = el.thickness;
    const r = size * 0.25;
    for(const p of pts){
        ctx.beginPath();
        const x = p.x - size/2, y = p.y - size/2;
        ctx.moveTo(x+r, y);
        ctx.arcTo(x+size, y, x+size, y+size, r);
        ctx.arcTo(x+size, y+size, x, y+size, r);
        ctx.arcTo(x, y+size, x, y, r);
        ctx.arcTo(x, y, x+size, y, r);
        ctx.closePath();
        ctx.fill();
    }
}

function drawShapeEl(el){
    const x1=el.startX,y1=el.startY,x2=el.endX,y2=el.endY;
    const w=Math.abs(x2-x1), h=Math.abs(y2-y1);
    const l=Math.min(x1,x2), t=Math.min(y1,y2);
    ctx.beginPath();
    if(el.shapeType==='rect') ctx.rect(l,t,w,h);
    else if(el.shapeType==='circle') ctx.ellipse(l+w/2,t+h/2,w/2,h/2,0,0,Math.PI*2);
    else if(el.shapeType==='triangle'){
        ctx.moveTo(l+w/2,t); ctx.lineTo(l+w,t+h); ctx.lineTo(l,t+h); ctx.closePath();
    }
    ctx.strokeStyle = el.color;
    ctx.lineWidth = el.thickness;
    ctx.lineJoin = 'round';
    ctx.stroke();
}

function handleSelectStart(x, y) {
    const obj = S.selection.object;
    
    if (obj) {
        const handleR = 30;
        const corners = [
            { name: 'nw', x: obj.x, y: obj.y },
            { name: 'ne', x: obj.x + obj.w, y: obj.y },
            { name: 'sw', x: obj.x, y: obj.y + obj.h },
            { name: 'se', x: obj.x + obj.w, y: obj.y + obj.h }
        ];
        
        for (const c of corners) {
            if (Math.hypot(x - c.x, y - c.y) <= handleR) {
                S.selection.dragMode = c.name;
                S.selection.dragStart = { x, y };
                S.selection.startRect = { x: obj.x, y: obj.y, w: obj.w, h: obj.h };
                return;
            }
        }
        
        if (x >= obj.x && x <= obj.x + obj.w && y >= obj.y && y <= obj.y + obj.h) {
            S.selection.dragMode = 'move';
            S.selection.dragStart = { x, y };
            S.selection.startRect = { x: obj.x, y: obj.y, w: obj.w, h: obj.h };
            return;
        }
        
        commitSelection();
    }
    
    S.selection.isLassoing = true;
    S.selection.lassoPoints = [{ x, y }];
}

function handleSelectMove(x, y) {
    const obj = S.selection.object;
    
    if (S.selection.dragMode && obj) {
        const dx = x - S.selection.dragStart.x;
        const dy = y - S.selection.dragStart.y;
        const r = S.selection.startRect;
        
        if (S.selection.dragMode === 'move') {
            obj.x = r.x + dx;
            obj.y = r.y + dy;
        } else {
            let nx = r.x, ny = r.y, nw = r.w, nh = r.h;
            if (S.selection.dragMode === 'nw') { nx = r.x + dx; ny = r.y + dy; nw = r.w - dx; nh = r.h - dy; }
            if (S.selection.dragMode === 'ne') { ny = r.y + dy; nw = r.w + dx; nh = r.h - dy; }
            if (S.selection.dragMode === 'sw') { nx = r.x + dx; nw = r.w - dx; nh = r.h + dy; }
            if (S.selection.dragMode === 'se') { nw = r.w + dx; nh = r.h + dy; }
            if (nw < 20) nw = 20;
            if (nh < 20) nh = 20;
            obj.x = nx;
            obj.y = ny;
            obj.w = nw;
            obj.h = nh;
        }
        
        redraw();
        return;
    }
    
    if (S.selection.isLassoing) {
        S.selection.lassoPoints.push({ x, y });
        redraw();
    }
}

function handleSelectEnd() {
    if (S.selection.dragMode) {
        S.selection.dragMode = null;
        return;
    }
    
    if (S.selection.isLassoing) {
        S.selection.isLassoing = false;
        const pts = S.selection.lassoPoints;
        S.selection.lassoPoints = []; 
        redraw(); 
        
        if (pts && pts.length > 5) {
            createSelectionFromLasso(pts);
        }
    }
}

function createSelectionFromLasso(points) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    points.forEach(p => {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
    });
    
    const w = maxX - minX;
    const h = maxY - minY;
    if (w < 10 || h < 10) return;
    
    const selCanvas = document.createElement('canvas');
    selCanvas.width = Math.max(1, Math.round(w * DPR));
    selCanvas.height = Math.max(1, Math.round(h * DPR));
    const sctx = selCanvas.getContext('2d');
    
    sctx.beginPath();
    points.forEach((p, i) => {
        const px = (p.x - minX) * DPR;
        const py = (p.y - minY) * DPR;
        if (i === 0) sctx.moveTo(px, py); else sctx.lineTo(px, py);
    });
    sctx.closePath();
    sctx.clip();
    
    sctx.drawImage(D.canvas, minX * DPR, minY * DPR, w * DPR, h * DPR, 0, 0, selCanvas.width, selCanvas.height);
    
    try {
        const bgColor = getBg();
        const bgRgb = hexToRgb(bgColor);
        const imgData = sctx.getImageData(0, 0, selCanvas.width, selCanvas.height);
        const data = imgData.data;
        const tol = 40;
        for (let i = 0; i < data.length; i += 4) {
            if (data[i + 3] === 0) continue;
            if (Math.abs(data[i] - bgRgb.r) <= tol &&
                Math.abs(data[i + 1] - bgRgb.g) <= tol &&
                Math.abs(data[i + 2] - bgRgb.b) <= tol) {
                data[i + 3] = 0;
            }
        }
        sctx.putImageData(imgData, 0, 0);
    } catch (e) { }
    
    const maskEl = {
        type: 'mask',
        points: points.map(p => ({ x: p.x, y: p.y })),
        color: getBg()
    };
    getElements().push(maskEl);
    
    S.selection.object = {
        canvas: selCanvas,
        x: minX, y: minY, w: w, h: h
    };
    S.selection.mask = maskEl;
    S.selection.dragMode = null;
    
    redraw();
    requestAnimationFrame(() => { redraw(); });
    D.selBar.classList.add('open');
}

function drawSelectionOverlay() {
    const obj = S.selection.object;
    if (!obj) return;
    
    ctx.save();
    ctx.drawImage(obj.canvas, obj.x, obj.y, obj.w, obj.h);
    
    ctx.strokeStyle = '#2DC360';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
    ctx.setLineDash([]);
    
    const hs = 6;
    const corners = [
        [obj.x, obj.y],
        [obj.x + obj.w, obj.y],
        [obj.x, obj.y + obj.h],
        [obj.x + obj.w, obj.y + obj.h]
    ];
    corners.forEach(([hx, hy]) => {
        ctx.beginPath();
        ctx.arc(hx, hy, hs, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#2DC360';
        ctx.lineWidth = 2;
        ctx.stroke();
    });
    
    ctx.restore();
}

function commitSelection() {
    const obj = S.selection.object;
    if (!obj) return;
    
    S.selection.object = null;
    S.selection.dragMode = null;
    S.selection.lassoPoints = [];
    S.selection.isLassoing = false;
    D.selBar.classList.remove('open');
    
    const tmp = document.createElement('canvas');
    tmp.width = Math.max(1, Math.round(obj.w * DPR));
    tmp.height = Math.max(1, Math.round(obj.h * DPR));
    const tctx = tmp.getContext('2d');
    tctx.drawImage(obj.canvas, 0, 0, tmp.width, tmp.height);
    const dataUrl = tmp.toDataURL('image/png');
    
    const img = new Image();
    img.onload = () => { redraw(); };
    img.src = dataUrl;
    
    getElements().push({
        type: 'image', img, src: dataUrl,
        x: obj.x, y: obj.y, w: obj.w, h: obj.h
    });
    
    redraw();
    pushHistory();
}

function copySelection() {
    const obj = S.selection.object;
    if (!obj) return;
    
    const tmp = document.createElement('canvas');
    tmp.width = Math.max(1, Math.round(obj.w * DPR));
    tmp.height = Math.max(1, Math.round(obj.h * DPR));
    const tctx = tmp.getContext('2d');
    tctx.drawImage(obj.canvas, 0, 0, tmp.width, tmp.height);
    const dataUrl = tmp.toDataURL('image/png');
    
    if (S.selection.mask) {
        const maskIdx = getElements().indexOf(S.selection.mask);
        if (maskIdx > -1) getElements().splice(maskIdx, 1);
        S.selection.mask = null;
    }
    
    S.selection.object = null;
    S.selection.dragMode = null;
    S.selection.lassoPoints = [];
    S.selection.isLassoing = false;
    D.selBar.classList.remove('open');
    
    const img = new Image();
    img.onload = () => { redraw(); };
    img.src = dataUrl;
    
    getElements().push({
        type: 'image', img, src: dataUrl,
        x: obj.x, y: obj.y, w: obj.w, h: obj.h
    });
    
    redraw();
    pushHistory();
}

function hexToRgb(hex){
    hex = (hex||'#000').replace('#','');
    if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
    return { r:parseInt(hex.substr(0,2),16)||0, g:parseInt(hex.substr(2,2),16)||0, b:parseInt(hex.substr(4,2),16)||0 };
}

    }
    S.selection.object = null;
    S.selection.mask = null;

function coords(e){
    const r = D.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function onDown(e){
    closeSubmenu();
    if(S.tool === 'pointer') return;   // 指针：点画布什么都不做
    
    if(S.selection.object && S.tool !== 'select'){
        commitSelection(); 
    }
    
    if(S.tool==='select'){
        const touch = (e.touches && e.touches[0]) || e;
        const p = coords(touch);
        handleSelectStart(p.x, p.y);
        return;
    }
    if(S.tool==='shape') return;
    
    const list = e.touches ? Array.from(e.touches) : [e];
    for(const t of list){
        const id = t.identifier ?? 'mouse';
        const p = coords(t);
        
        const stroke = {
            type: S.tool==='eraser' ? 'eraser' : 'pen',
            color: S.tool==='eraser' ? '#000' : S.penColor,
            thickness: S.tool==='eraser' ? S.eraserSize : S.penThickness,
            points: [{ x:p.x, y:p.y, pressure: 0.5 }],
            pointsWithPressure: [{ x:p.x, y:p.y, pressure: 0.5 }]
        };
        S.touches.set(id, { el:stroke, lastX:p.x, lastY:p.y, lastT:Date.now(), lastV: 0 });
        getElements().push(stroke);
    }
    redraw();
}

function onMove(e){
    const touch = (e.touches && e.touches[0]) || e;
    if(S.tool==='pointer'){ D.cursor.style.display='none'; return; }
    if(S.tool==='eraser'){
        const p = coords(touch);
        D.cursor.style.display = 'block';
        D.cursor.style.left = p.x + 'px';
        D.cursor.style.top = p.y + 'px';
        D.cursor.style.width = S.eraserSize + 'px';
        D.cursor.style.height = S.eraserSize + 'px';
    } else {
        D.cursor.style.display = 'none';
    }

    if(S.tool==='select'){
        const t = (e.touches && e.touches[0]) || e;
        handleSelectMove(coords(t).x, coords(t).y);
        return;
    }
    if(S.tool==='shape') return;

    const list = e.touches ? Array.from(e.touches) : (e.changedTouches ? Array.from(e.changedTouches) : [e]);
    let dirty = false;
    for(const t of list){
        const id = t.identifier ?? 'mouse';
        const rec = S.touches.get(id);
        if(!rec) continue;
        const p = coords(t);
        const el = rec.el;
        
        const now = Date.now();
        const dt = Math.max(now - rec.lastT, 1);
        const dist = Math.hypot(p.x-rec.lastX, p.y-rec.lastY);
        const speed = dist/dt;
        
        rec.lastV = (rec.lastV * 0.7) + (speed * 0.3);
        
        let pressure;
        if (t.force !== undefined && t.force !== null && t.force > 0 && t.force < 1) {
            pressure = t.force;
        } else {
            pressure = Math.max(0.15, Math.min(1, 1 - rec.lastV * 0.03));
        }
        
        const lastP = el.points[el.points.length - 1];
        if (lastP && lastP.pressure !== undefined) {
            pressure = lastP.pressure * 0.6 + pressure * 0.4;
        }
        
        el.points.push({ x:p.x, y:p.y, pressure });
        if (el.pointsWithPressure) el.pointsWithPressure.push({ x:p.x, y:p.y, pressure });
        
        rec.lastX = p.x; rec.lastY = p.y; rec.lastT = now;
        dirty = true;
    }
    if(dirty) redraw();
}

function onUp(e){
    D.cursor.style.display = 'none';
    if(S.tool==='select'){
        handleSelectEnd();
        return;
    }
    if(S.tool==='shape') return;
    
    const list = e.changedTouches ? Array.from(e.changedTouches) : [e];
    for(const t of list){
        const id = t.identifier ?? 'mouse';
        const rec = S.touches.get(id);
        if(rec){
            if(rec.el.points && rec.el.points.length>0) pushHistory();
            S.touches.delete(id);
        }
    }
    redraw();
}

function pushHistory(){
    S.history.push({
        mode:S.mode, page:S.pageIdx, slide:S.slideIdx,
        data: getElements().map(e => {
            if(e.type==='image') return { type:'image', src:e.src || (e.img ? e.img.src : ''), x:e.x, y:e.y, w:e.w, h:e.h };
            return JSON.parse(JSON.stringify(e));
        })
    });
    if(S.history.length>40) S.history.shift();
}

function undo(){
    if(S.history.length===0) return;
    const h = S.history.pop();
    if(h.mode!==S.mode) return;
    const restoreData = h.data.map(e=>{
        if(e.type==='image' && e.src){
            const img = new Image(); img.src = e.src;
            return {...e, img};
        }
        return e;
    });
    
    if(S.mode==='ppt' && S.ppt){
        S.slideIdx = h.slide;
        S.ppt.slides[S.slideIdx].elements = restoreData;
        renderPPT();
    } else {
        S.pageIdx = h.page;
        S.pages[S.pageIdx].elements = restoreData;
    }
    redraw();
    updatePageInd();
}

function closeSubmenu(){

        S.submenuTarget = null;

}

function setActiveToolUI(){
    document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
    if(S.tool==='pen') $('tool-pen').classList.add('active');
    else if(S.tool==='eraser') $('tool-eraser').classList.add('active');
    else if(S.tool==='select') $('tool-select').classList.add('active');
    else if(S.tool==='pointer') $('tool-pointer').classList.add('active');
    else if(S.tool==='more') $('tool-more').classList.add('active');
    
    const act = document.querySelector('.tool-btn.active');
    if(act){
        const tb = D.toolbar.getBoundingClientRect();
        const br = act.getBoundingClientRect();
        const unscaledW = D.toolbar.offsetWidth || 1;
        const scale = unscaledW > 0 ? (tb.width / unscaledW) : 1;
        
        if(document.body.classList.contains('compact-ui')){
            D.indicator.style.width = '48px';
            D.indicator.style.height = '48px';
            D.indicator.style.transform = `translateY(${(br.top - tb.top) / scale}px)`;
        } else {
            D.indicator.style.width = act.offsetWidth + 'px';
            D.indicator.style.height = '';
            D.indicator.style.transform = `translateX(${(br.left - tb.left) / scale}px)`;
        }
        D.indicator.style.opacity = '1';
    } else {
        D.indicator.style.opacity = '0';
    }
    D.canvas.style.cursor = S.tool==='pointer' ? 'default' : ((S.tool==='eraser' || S.tool==='select') ? 'none' : 'crosshair');
}

function clearSelectionAndSwitch(toolName) {
    if (S.selection.object) commitSelection();
    S.tool = toolName;
