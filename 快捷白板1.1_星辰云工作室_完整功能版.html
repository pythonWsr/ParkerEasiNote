function showLoadList(){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('easinote_save_')) keys.push(k);
    }
    keys.sort().reverse();
    let html = '<div class="save-list">';
    if(!keys.length) html += '<div class="save-empty">暂无保存的文件</div>';
    else {
        keys.forEach(k=>{
            let d = {};
            try{ d = JSON.parse(localStorage.getItem(k)); }catch(e){}
            const t = d.time || k.replace('easinote_save_','');
            html += `<div class="save-item" data-k="${k}">
                <span class="name"><i class="fas fa-file-signature" style="color:#2DC360;margin-right:6px;"></i>${t}</span>
                <span class="date">${d.pages?d.pages.length:0}页</span>
                <button class="del" data-del="${k}"><i class="fas fa-trash"></i></button>
            </div>`;
        });
    }
    html += '</div>';
    const ov = openModal({
        title:'保存的文件', icon:'fa-folder-open',
        content:html,
        actions:[{ id:'close', label:'关闭', type:'cancel' }]
    });
    ov.querySelectorAll('.save-item').forEach(el=>{
        el.onclick = (e)=>{
            if(e.target.closest('.del')) return;
            const k = el.dataset.k;
            try{
                const d = JSON.parse(localStorage.getItem(k));
                if(d && d.pages){
                    S.pages = d.pages.map(p=>({
                        bg:p.bg || '#0F261E',
                        elements:(p.elements||[]).map(e=>{
                            if(e.type==='image' && e.src){
                                const img = new Image(); img.src = e.src;
                                return {...e, img};
                            }
                            return e;
                        })
                    }));
                    S.pageIdx = 0;
                    S.mode = 'whiteboard';
                    S.history = [];
                    $('menu-exit-ppt').classList.add('hidden');
                    updatePptUi(false);
                    updateBg(); redraw(); updatePageInd(); updatePageThumbnails();
                    closeModal(ov);
                    toast('加载成功','fa-check');
                }
            }catch(err){ toast('加载失败','fa-exclamation-triangle'); }
        };
    });
    ov.querySelectorAll('[data-del]').forEach(btn=>{
        btn.onclick = (e)=>{
            e.stopPropagation();
            localStorage.removeItem(btn.dataset.del);
            closeModal(ov);
            showLoadList();
        };
    });
}

/* [IMPORT-FIX] 第二种导入：把文件直接拖到页面上 / 粘贴。
   按 ZIP 内容区分 enbx 与 pptx，选错入口也能正常打开。 */
function importAnyFile(file){
    if(!file) return;
    const n = (file.name||'').toLowerCase();
    if(/\.(png|jpe?g|gif|bmp|webp|svg)$/.test(n)){
        toast('图片请用「更多 → 贴图」插入','fa-image'); return;
    }
    const fr = new FileReader();
    fr.onload = ()=>{
        const buf = fr.result;
        const u = new Uint8Array(buf.slice(0,4));
        if(!(u[0]===0x50 && u[1]===0x4B)){
            openModal({ title:'这个文件不是课件包', icon:'fa-triangle-exclamation',
                content:'<div class="sheet-hint">.enbx / .pptx 本质是 ZIP 压缩包，但这个文件开头不是 ZIP 头。<br><br>常见于从微信 / QQ 直接打开、网盘转存损坏，或者它其实是个云端链接。<br><br>请先<b>保存到本地</b>，再用左下 ☰ 菜单里的「打开希沃课件」重新选一次；选不到就把后缀改成 <b>.zip</b>。</div>' });
            return;
        }
        JSZip.loadAsync(buf).then(zip=>{
            const ns = Object.keys(zip.files);
            if(ns.some(x=>/^ppt\//i.test(x))) handlePptFile(file);
            else { if(S.selection.object) commitSelection(); if(S.mode==='ppt') exitPPT(); openEnbxFile(file); }
        }).catch(()=>{ if(S.mode==='ppt') exitPPT(); openEnbxFile(file); });
    };
    fr.onerror = ()=>{ toast('文件读取失败','fa-exclamation-triangle'); };
    fr.readAsArrayBuffer(file);
}
let dragDepth = 0;
window.addEventListener('dragenter', e=>{ e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragover',  e=>{ e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect='copy'; });
window.addEventListener('dragleave', e=>{ e.preventDefault(); if(--dragDepth<=0){ dragDepth=0; document.body.classList.remove('dragging'); } });
window.addEventListener('drop', e=>{
    e.preventDefault(); dragDepth=0; document.body.classList.remove('dragging');
    const fs = e.dataTransfer && e.dataTransfer.files;
    if(fs && fs.length) importAnyFile(fs[0]);
});
window.addEventListener('paste', e=>{
    const fs = e.clipboardData && e.clipboardData.files;
    if(fs && fs.length){ e.preventDefault(); importAnyFile(fs[0]); }
});

                    <li>还原 RichText 逐行文字（字号 / ARGB 颜色 / 粗体 / 字体），排除 DefaultRunProperty 模板副本</li>
                    <li>背景图 id:// 经 Reference.xml 映射成真实图片；缺 Reference / Board 时按 Resources 扫描兜底</li>

/* ── 模块 12 / 事件绑定与启动 ─────────────────────────────── */
function init(){
    resizeCanvas();
    updateBg();
    applyChromeTheme();
    updatePageInd();
    setActiveToolUI();
    checkNarrow();
    tick();
    S.clockTimer = setInterval(tick,1000);

    D.canvas.addEventListener('touchstart', e=>{ e.preventDefault(); onDown(e); }, {passive:false});
    D.canvas.addEventListener('touchmove', e=>{ e.preventDefault(); onMove(e); }, {passive:false});
    D.canvas.addEventListener('touchend', e=>{ e.preventDefault(); onUp(e); }, {passive:false});
    D.canvas.addEventListener('touchcancel', e=>{ e.preventDefault(); onUp(e); }, {passive:false});
    D.canvas.addEventListener('mousedown', e=>{ if(e.button===0) onDown(e); });
    D.canvas.addEventListener('mousemove', e=>onMove(e));
    D.canvas.addEventListener('mouseup', e=>onUp(e));
    D.canvas.addEventListener('mouseleave', e=>onUp(e));

    D.canvas.addEventListener('mousedown', shapeDown);
    D.canvas.addEventListener('mousemove', shapeMove);
    D.canvas.addEventListener('mouseup', shapeUp);
    D.canvas.addEventListener('touchstart', e=>{ if(S.tool==='shape'){ e.preventDefault(); const t=e.touches[0]; if(t) shapeDown({clientX:t.clientX,clientY:t.clientY}); } }, {passive:false});
    D.canvas.addEventListener('touchmove', e=>{ if(S.tool==='shape'){ e.preventDefault(); const t=e.touches[0]; if(t) shapeMove({clientX:t.clientX,clientY:t.clientY}); } }, {passive:false});
    D.canvas.addEventListener('touchend', e=>{ if(S.tool==='shape'){ e.preventDefault(); shapeUp(); } }, {passive:false});

    window.addEventListener('resize', ()=>{
        resizeCanvas();
        checkNarrow();
        setActiveToolUI();
    });

    setTimeout(showUpdate, 400);
}
